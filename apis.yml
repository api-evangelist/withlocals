aid: withlocals

name: Withlocals

description: Withlocals is an experiential travel platform that connects travelers with verified local hosts for private, personalized tours,
  food experiences and home dinners — over 2,500 experiences in more than 250 destinations (per withlocals.com). It publishes a Withlocals Partner
  API for distribution partners, documented at developers.withlocals.com, and maintains the WithlocalsDev GitHub organization.

